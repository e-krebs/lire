name = "lire-api"
main = "src/server/worker.ts"
compatibility_date = "2025-01-01"

routes = [{ pattern = "lire.krebs.tech/api/*", zone_name = "krebs.tech" }]

[[durable_objects.bindings]]
name = "FEEDLY_AUTH"
class_name = "FeedlyAuth"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FeedlyAuth"]

[vars]
FEEDLY_HOST = "https://cloud.feedly.com"
FEEDLY_CLIENT_ID = "feedly"
ACCESS_TEAM_DOMAIN = "lire-6s2-pages.cloudflareaccess.com"
ACCESS_AUD = "80a2c7fef3de869a12354a2a822ae8ef803a29a2953ad24f41ce690c955cad0a"

# Owner pin: CI sets ACCESS_ALLOWED_EMAIL from the GitHub secret of the same name
