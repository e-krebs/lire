name = "lire-api"
main = "src/server/worker.ts"
compatibility_date = "2025-01-01"

routes = [{ pattern = "lire.krebs.tech/api/*", zone_name = "krebs.tech" }]

[[durable_objects.bindings]]
name = "NEWSBLUR_AUTH"
class_name = "NewsblurAuth"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FeedlyAuth"]

# The refresh token the previous upstream's auth object stored has no use on NewsBlur.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["NewsblurAuth"]
deleted_classes = ["FeedlyAuth"]

[vars]
NEWSBLUR_HOST = "https://newsblur.com"
ACCESS_TEAM_DOMAIN = "lire-6s2-pages.cloudflareaccess.com"
ACCESS_AUD = "80a2c7fef3de869a12354a2a822ae8ef803a29a2953ad24f41ce690c955cad0a"

# Secrets: CI sets ACCESS_ALLOWED_EMAIL, NEWSBLUR_USERNAME, NEWSBLUR_PASSWORD and
# NEWSBLUR_NEWSLETTER_ADDRESS from the GitHub secrets of the same names
