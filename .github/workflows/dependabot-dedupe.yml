name: Dependabot dedupe

on:
  pull_request:
    paths: [yarn.lock]

permissions:
  contents: read

jobs:
  dedupe:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A push with the default GITHUB_TOKEN starts no workflow, so the commit would get no CI run.
      # The secret lives in the Dependabot secret store: Dependabot runs cannot read Actions secrets.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.DEPENDABOT_DEDUPE_TOKEN }}
      - uses: ./.github/actions/setup
      - run: yarn dedupe
      - name: Push the deduped lockfile
        run: |
          git diff --quiet yarn.lock && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): dedupe the lockfile" yarn.lock
          git push
