name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Docs link gate
        run: yarn check:links
      - name: Lockfile dedupe gate
        run: yarn dedupe --check
      - run: yarn lint
      - run: yarn knip
      - run: yarn knip:production
      - run: yarn format:check
      - run: yarn typecheck
      - run: yarn typecheck:worker
      - run: yarn typecheck:e2e
      - run: yarn typecheck:node
      - run: yarn test:coverage
      - run: yarn test:worker:coverage
      - run: yarn check:export-coverage
      - name: Build
        run: yarn build
      - name: Secret gate
        run: yarn check:secrets
      - name: Real build
        run: VITE_API_MODE=real yarn build
      - name: Real secret and fixture gate
        run: VITE_API_MODE=real yarn check:secrets
      - name: Demo build
        run: yarn build:demo
      - name: Demo brand gate
        run: yarn check:demo
      - name: Demo secret gate
        run: yarn check:secrets

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-webkit-${{ steps.playwright.outputs.version }}
      # install-deps always runs: apt packages are not in the browser cache.
      - run: yarn playwright install-deps chromium webkit
        timeout-minutes: 5
      - run: yarn playwright install chromium webkit
        timeout-minutes: 5
      - run: yarn test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright.outputs.version }}
      # install-deps always runs: apt packages are not in the browser cache.
      - run: yarn playwright install-deps chromium
        timeout-minutes: 5
      - run: yarn playwright install chromium
        timeout-minutes: 5
      - run: yarn test:storybook
      - run: yarn build:storybook
      - run: yarn check:demo storybook-static

  # Every Cloudflare job reads this output — they skip cleanly on PRs, forks and until the repo secrets are set.
  cloudflare-gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - name: Gate on Cloudflare secrets
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping deploy."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  # Checks the Access config and creates missing Pages projects, domains and DNS records before any deploy.
  preflight:
    needs: [cloudflare-gate]
    if: needs.cloudflare-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: preflight
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_ALLOWED_EMAIL: ${{ secrets.ACCESS_ALLOWED_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Access config check
        run: yarn check:access
      - name: Provision Pages
        run: yarn provision:pages

  # Gated by cloudflare-gate, after preflight.
  deploy:
    needs: [cloudflare-gate, verify, e2e, preflight]
    if: needs.cloudflare-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Builds in real mode and runs the secret gate before it deploys.
      - name: Deploy SPA
        run: yarn deploy:spa

  # Gated by cloudflare-gate, after preflight.
  deploy-demo:
    needs: [cloudflare-gate, verify, e2e, preflight]
    if: needs.cloudflare-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Deploy demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: yarn deploy:demo

  # Gated by cloudflare-gate, after preflight.
  deploy-storybook:
    needs: [cloudflare-gate, storybook, preflight]
    if: needs.cloudflare-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-storybook
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Deploy Storybook
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: yarn deploy:storybook

  # Gated by cloudflare-gate, after preflight. --secrets-file adds or updates the pin, never deletes other secrets.
  deploy-worker:
    needs: [cloudflare-gate, verify, e2e, preflight]
    if: needs.cloudflare-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_ALLOWED_EMAIL: ${{ secrets.ACCESS_ALLOWED_EMAIL }}
    steps:
      - name: Require the Access email pin
        run: |
          if [ -z "$ACCESS_ALLOWED_EMAIL" ]; then
            echo "::error::ACCESS_ALLOWED_EMAIL secret not set — the Worker would fall back to the Access policy alone."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Write Worker secrets file
        run: printf 'ACCESS_ALLOWED_EMAIL=%s\n' "$ACCESS_ALLOWED_EMAIL" > "$RUNNER_TEMP/worker.env"
      - name: Deploy Worker
        run: yarn worker:deploy --secrets-file "$RUNNER_TEMP/worker.env"

  # Node built-ins only, so no install.
  check-live:
    needs: [cloudflare-gate, deploy, deploy-demo, deploy-storybook, deploy-worker]
    if: needs.cloudflare-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Live check
        run: node scripts/check-live.ts
