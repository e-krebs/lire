name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true' || steps.unknown.outputs.unknown == 'true' }}
      storybook: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.storybook == 'true' || steps.unknown.outputs.unknown == 'true' }}
      worker: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.worker == 'true' || steps.unknown.outputs.unknown == 'true' }}
      tooling: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.tooling == 'true' || steps.unknown.outputs.unknown == 'true' }}
      infra: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.infra == 'true' || steps.unknown.outputs.unknown == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - name: Filter changed areas
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            app:
              - 'src/client/**'
              - 'src/shared/**'
              - 'public/**'
              - 'index.html'
              - 'vite.config.ts'
              - 'fixtures/**'
              - 'scripts/check-dist-secrets.ts'
              - 'scripts/check-demo-brand.ts'
              - 'package.json'
              - 'yarn.lock'
              - '.yarnrc.yml'
              - '.yarn/**'
              - '.nvmrc'
              - '**/tsconfig*.json'
              - '.github/actions/setup/**'
              - '.github/workflows/ci.yml'
            storybook:
              - '.storybook/**'
              - 'src/client/**'
              - 'src/shared/**'
              - 'public/**'
              - 'fixtures/**'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'scripts/check-demo-brand.ts'
              - 'src/test/**'
              - 'package.json'
              - 'yarn.lock'
              - '.yarnrc.yml'
              - '.yarn/**'
              - '.nvmrc'
              - '**/tsconfig*.json'
              - '.github/actions/setup/**'
              - '.github/workflows/ci.yml'
            worker:
              - 'src/server/**'
              - 'src/shared/**'
              - 'wrangler.toml'
              - 'package.json'
              - 'yarn.lock'
              - '.yarnrc.yml'
              - '.yarn/**'
              - '.nvmrc'
              - '**/tsconfig*.json'
              - '.github/actions/setup/**'
              - '.github/workflows/ci.yml'
            tooling:
              - 'src/test/**'
              - 'e2e/**'
              - 'scripts/**'
              - 'playwright.config.ts'
              - 'vitest.config.ts'
              - 'knip.json'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - 'package.json'
              - 'yarn.lock'
              - '.yarnrc.yml'
              - '.yarn/**'
              - '.nvmrc'
              - '**/tsconfig*.json'
              - '.github/actions/setup/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'scripts/provision-pages.ts'
              - 'scripts/check-access.ts'
              - 'scripts/cloudflare-api.ts'
              - 'scripts/check-live.ts'
              - 'scripts/deploy-targets.ts'
              - 'package.json'
              - 'yarn.lock'
              - '.yarnrc.yml'
              - '.yarn/**'
              - '.nvmrc'
              - '**/tsconfig*.json'
              - '.github/actions/setup/**'
              - '.github/workflows/ci.yml'
      # Fail-open guard: a changed file that no list or ignore list names turns every output on.
      - name: Detect unclassified files
        id: unknown
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            unknown:
              - '**'
              - '!src/client/**'
              - '!src/shared/**'
              - '!public/**'
              - '!index.html'
              - '!vite.config.ts'
              - '!fixtures/**'
              - '!scripts/check-dist-secrets.ts'
              - '!scripts/check-demo-brand.ts'
              - '!package.json'
              - '!yarn.lock'
              - '!.yarnrc.yml'
              - '!.yarn/**'
              - '!.nvmrc'
              - '!**/tsconfig*.json'
              - '!.github/actions/setup/**'
              - '!.github/workflows/ci.yml'
              - '!android/**'
              - '!docs/**'
              - '!**/*.md'
              - '!.claude/**'
              - '!.editorconfig'
              - '!.gitignore'
              - '!.env.sample'
              - '!.github/dependabot.yml'
              - '!.github/workflows/android.yml'
              - '!.storybook/**'
              - '!vitest.config.ts'
              - '!src/test/**'
              - '!src/server/**'
              - '!wrangler.toml'
              - '!e2e/**'
              - '!scripts/**'
              - '!playwright.config.ts'
              - '!knip.json'
              - '!.oxlintrc.json'
              - '!.oxfmtrc.json'
              - '!scripts/provision-pages.ts'
              - '!scripts/check-access.ts'
              - '!scripts/cloudflare-api.ts'
              - '!scripts/check-live.ts'
              - '!scripts/deploy-targets.ts'

  docs-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: yarn check:links

  verify:
    needs: [changes]
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.worker == 'true' || needs.changes.outputs.storybook == 'true' || needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lockfile dedupe gate
        run: yarn dedupe --check
      - run: yarn lint
      - run: yarn knip
      - run: yarn knip:production
      - run: yarn format:check
      - run: yarn typecheck
      - run: yarn typecheck:worker
      - run: yarn typecheck:e2e
      - run: yarn typecheck:node
      - run: yarn test:coverage
      - run: yarn test:worker:coverage
      - run: yarn check:export-coverage
      - name: Build
        run: yarn build
      - name: Secret gate
        run: yarn check:secrets
      - name: Real build
        run: VITE_API_MODE=real yarn build
      - name: Real secret and fixture gate
        run: VITE_API_MODE=real yarn check:secrets
      - name: Demo build
        run: yarn build:demo
      - name: Demo brand gate
        run: yarn check:demo
      - name: Demo secret gate
        run: yarn check:secrets

  e2e:
    needs: [changes]
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.worker == 'true' || needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-webkit-${{ steps.playwright.outputs.version }}
      # install-deps always runs: apt packages are not in the browser cache.
      - run: yarn playwright install-deps chromium webkit
        timeout-minutes: 5
      - run: yarn playwright install chromium webkit
        timeout-minutes: 5
      - run: yarn test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  storybook:
    needs: [changes]
    if: needs.changes.outputs.storybook == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright.outputs.version }}
      # install-deps always runs: apt packages are not in the browser cache.
      - run: yarn playwright install-deps chromium
        timeout-minutes: 5
      - run: yarn playwright install chromium
        timeout-minutes: 5
      - run: yarn test:storybook
      - run: yarn build:storybook
      - run: yarn check:demo storybook-static

  # Every Cloudflare job reads this output — they skip cleanly on PRs, forks and until the repo secrets are set.
  cloudflare-gate:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - name: Gate on Cloudflare secrets
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping deploy."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  # Checks the Access config and creates missing Pages projects, domains and DNS records before any deploy.
  preflight:
    needs: [changes, cloudflare-gate]
    if: needs.cloudflare-gate.outputs.enabled == 'true' && (needs.changes.outputs.app == 'true' || needs.changes.outputs.storybook == 'true' || needs.changes.outputs.worker == 'true' || needs.changes.outputs.infra == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: preflight
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_ALLOWED_EMAIL: ${{ secrets.ACCESS_ALLOWED_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Require the NewsBlur OAuth client id
        run: |
          if ! grep -Eq '^NEWSBLUR_CLIENT_ID = "[^"]+"' wrangler.toml; then
            echo "::error::NEWSBLUR_CLIENT_ID is empty in wrangler.toml — sign-in cannot reach NewsBlur."
            exit 1
          fi
      - name: Access config check
        run: yarn check:access
      - name: Provision Pages
        run: yarn provision:pages

  # Gated by cloudflare-gate, after preflight.
  deploy:
    needs: [changes, cloudflare-gate, verify, e2e, preflight]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.cloudflare-gate.outputs.enabled == 'true' && needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Builds in real mode and runs the secret gate before it deploys.
      - name: Deploy SPA
        run: yarn deploy:spa

  # Gated by cloudflare-gate, after preflight.
  deploy-demo:
    needs: [changes, cloudflare-gate, verify, e2e, preflight]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.cloudflare-gate.outputs.enabled == 'true' && needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Deploy demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: yarn deploy:demo

  # Gated by cloudflare-gate, after preflight.
  deploy-storybook:
    needs: [changes, cloudflare-gate, storybook, preflight]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.cloudflare-gate.outputs.enabled == 'true' && needs.changes.outputs.storybook == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-storybook
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Deploy Storybook
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: yarn deploy:storybook

  # Gated by cloudflare-gate, after preflight. --secrets-file adds or updates the listed secrets, never deletes other secrets.
  deploy-worker:
    needs: [changes, cloudflare-gate, verify, e2e, preflight]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.cloudflare-gate.outputs.enabled == 'true' && needs.changes.outputs.worker == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_ALLOWED_EMAIL: ${{ secrets.ACCESS_ALLOWED_EMAIL }}
      NEWSBLUR_CLIENT_SECRET: ${{ secrets.NEWSBLUR_CLIENT_SECRET }}
      NEWSBLUR_NEWSLETTER_ADDRESS: ${{ secrets.NEWSBLUR_NEWSLETTER_ADDRESS }}
    steps:
      - name: Require the Access email pin
        run: |
          if [ -z "$ACCESS_ALLOWED_EMAIL" ]; then
            echo "::error::ACCESS_ALLOWED_EMAIL secret not set — the Worker would fall back to the Access policy alone."
            exit 1
          fi
      - name: Require the NewsBlur client secret
        run: |
          if [ -z "$NEWSBLUR_CLIENT_SECRET" ]; then
            echo "::error::NEWSBLUR_CLIENT_SECRET secret not set — the OAuth code exchange would fail."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Write Worker secrets file
        run: |
          printf 'ACCESS_ALLOWED_EMAIL=%s\nNEWSBLUR_CLIENT_SECRET=%s\nNEWSBLUR_NEWSLETTER_ADDRESS=%s\n' \
            "$ACCESS_ALLOWED_EMAIL" "$NEWSBLUR_CLIENT_SECRET" "$NEWSBLUR_NEWSLETTER_ADDRESS" \
            > "$RUNNER_TEMP/worker.env"
      - name: Deploy Worker
        run: yarn worker:deploy --secrets-file "$RUNNER_TEMP/worker.env"

  # Node built-ins only, so no install.
  check-live:
    needs: [changes, cloudflare-gate, deploy, deploy-demo, deploy-storybook, deploy-worker]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.cloudflare-gate.outputs.enabled == 'true' && (needs.changes.outputs.infra == 'true' || needs.deploy.result == 'success' || needs.deploy-demo.result == 'success' || needs.deploy-storybook.result == 'success' || needs.deploy-worker.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Live check
        run: node scripts/check-live.ts
