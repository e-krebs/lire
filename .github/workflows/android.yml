name: Android

# Builds the signed TWA and attaches the APK to a GitHub Release, to install by hand.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  # A pull request only checks that the project builds: it gets no signing secret.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - working-directory: android
        run: ./gradlew assembleDebug

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The run number only grows, so every release can update the installed app.
      LIRE_VERSION_CODE: ${{ github.run_number }}
      LIRE_VERSION_NAME: 1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      # The wrapper jar runs with the signing secrets in its environment.
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - working-directory: android
        env:
          LIRE_KEYSTORE_BASE64: ${{ secrets.LIRE_KEYSTORE_BASE64 }}
          LIRE_KEYSTORE_PASSWORD: ${{ secrets.LIRE_KEYSTORE_PASSWORD }}
        run: |
          export LIRE_KEYSTORE_FILE="$RUNNER_TEMP/lire.keystore"
          base64 --decode <<< "$LIRE_KEYSTORE_BASE64" > "$LIRE_KEYSTORE_FILE"
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/lire-$LIRE_VERSION_NAME.apk"
      # A re-run keeps the run number, so its release already exists: replace the APK instead.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-$LIRE_VERSION_NAME"
          apk="$RUNNER_TEMP/lire-$LIRE_VERSION_NAME.apk"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --title "Android $LIRE_VERSION_NAME" \
              --target "$GITHUB_SHA" --notes "Sideload this APK on Android to install or update Lire."
          fi
