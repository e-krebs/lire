name: Setup
description: Enable Corepack, set up Node with the Yarn cache and install dependencies

runs:
  using: composite
  steps:
    # Corepack must run first: setup-node asks Yarn for its cache folder.
    # Recent Node builds no longer bundle it, and the Playwright image tracks them.
    # --force: the image ships its own /usr/bin/yarn, which the Corepack shims replace.
    - run: command -v corepack >/dev/null || npm install --global --force corepack
      shell: bash
    - run: corepack enable
      shell: bash
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: yarn
    - run: yarn install --immutable
      shell: bash
